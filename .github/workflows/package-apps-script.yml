name: Paketle - Google Apps Script
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/package-apps-script.yml'
  workflow_dispatch:
concurrency:
  group: ayda-apps-script-package-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Birim testleri
        run: npm test
      - name: TypeScript derleme ve Apps Script paketleme
        env:
          VITE_APP_REVISION: ${{ github.sha }}
        run: npm run build:apps-script
      - name: Son HTML sürümünü repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: Apps Script HTML yenilendi [skip ci]"
            git pull --rebase origin main
            git push
          fi
